#HTML Report

#start the HTML report
extent.reporter.spark.start=true
#path and name of HTML report
extent.reporter.spark.out=report/html/Birlaopus.html
#Path to the configuration file for the Spark HTML reporter
extent.reporter.spark.config=src/test/resources/ExtentConfig.xml

#PDF Report

#Start the PDF report
extent.reporter.pdf.start=true
