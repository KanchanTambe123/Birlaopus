n User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    Then Product should be added to the cart successfully\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n\n    Examples: \n      | navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               2 | Mumbai  |                2 |\n\n  #----------------------------------2---------------------------------------------------->\n  Scenario Outline: To verify that a logged-in user can successfully add a product to the cart through searchbar\n    When User clicks on the search icon\n    Then User enters the product name \"<searchfor>\" in the search box\n    And User selects and clicks on the product\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    Then Product should be added to the cart successfully\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n\n    Examples: \n      | searchfor       | Colour    | quantity | pack | pincode |\n      | Interior paints | Rose dust |        1 |    1 |  411033 |\n\n  #----------------------------------3---------------------------------------------------->\n  Scenario Outline: To verify that the total price is updated correctly when the product quantity is changed through navigation for a logged-in user\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    And User increase the product quantity \"<desiredQuantity>\"\n    #Then User clicks on the Proceed to Enter Address button\n    #And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n\n    Examples: \n      | navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               5 | Mumbai  |                5 |\n\n  #----------------------------------4---------------------------------------------------->\n  Scenario Outline: To verify that a logged-in user can remove a product from the header cart\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    And Cart count should be updated to \"<expectedCount>\"\n\n    Examples: \n      | navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity | address | expectedQuantity | expectedCount |\n      | Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               5 | Mumbai  |                5 |             0 |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birlaopus_selenium/com.BirlaOpus/src/test/resources/features/Cart_Functionality.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@Report","id":"fda9259a-3498-47ee-b94e-3cdaa4ec8498"}],"language":"en","keyword":"Feature","name":"To Validate Cart Functionality – Add, Update, Remove and Price Validation (Single Product)","description":"","children":[{"background":{"location":{"line":4,"column":3},"keyword":"Background","name":"","description":"","steps":[{"location":{"line":5,"column":5},"keyword":"Given ","keywordType":"Context","text":"User is on BirlaOpus HomePage \"birlaopusHomeUrl\"","id":"05fdc823-7289-4f6a-9dc7-9951d2b1eea9"},{"location":{"line":6,"column":5},"keyword":"When ","keywordType":"Action","text":"User clicks on the profile icon","id":"6636c7cc-fd3d-4dd5-8303-ce7cdc9c52b6"},{"location":{"line":7,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"User clicks on the Sign In button","id":"5b875850-40dc-4c0f-b893-802fdaa0831f"},{"location":{"line":8,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"User enters valid mobile number mobile number on the Sign In page","id":"a9f1ad89-314d-45ee-9187-a88b28294a99"},{"location":{"line":9,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"the User clicks on the Sign In butto ---------------------------------2---------------------------------------------------->\n  Scenario Outline: To verify that user can remove a product from the comparison list\n    Given User is on first product url \"CompareFirstProductUrl\" and adds first product \"<FirstProduct>\" to the comparison list\n    And User is on second product url \"CompareSecondProductUrl\" and adds second product \"<SecondProduct>\" to the comparison list\n    And User can view the comparison page with the selected products\n    When User removes \"<ProductToRemove>\" from the comparison list\n    Then the compare counter should display \"<ExpectedCountAfterRemove>\"\n    And The comparison list should contain \"<RemainingProduct>\"\n\n    Examples: \n      | FirstProduct      | SecondProduct      | ProductToRemove   | ExpectedCountAfterRemove | RemainingProduct   |\n      | Style Color Smart | Style Super Bright | Style Color Smart |                        1 | Style Super Bright |\n\n  #----------------------------------3---------------------------------------------------->\n  Scenario Outline: To verify Compare Page opens correctly\n    Given User is on first product url \"CompareFirstProductUrl\" and adds first product \"<FirstProduct>\" to the comparison list\n    And User is on second product url \"CompareSecondProductUrl\" and adds second product \"<SecondProduct>\" to the comparison list\n    And User can view the comparison page with the selected products\n    When User clicks on the Compare Now button\n    Then Compare Page should be displayed\n    And All selected products should be visible with their details\n\n    Examples: \n      | FirstProduct      | SecondProduct      |\n      | Style Color Smart | Style Super Bright |\n\n  #----------------------------------4---------------------------------------------------->\n  Scenario Outline: To verify product titles and count on the Compare page\n    Given User is on first product url \"CompareFirstProductUrl\" and adds first product \"<FirstProduct>\" to the comparison list\n    And User is on second product url \"CompareSecondProductUrl\" and adds second product \"<SecondProduct>\" to the comparison list\n    And User can view the comparison page with the selected products\n    When User clicks on the Compare Now button\n    Then User should see the correct product titles on the Compare page.\n    Then User should see and verify that the product count is \"<ExpectedCount>\"\n\n    Examples: \n      | FirstProduct      | SecondProduct      | ExpectedCount |\n      | Style Color Smart | Style Super Bright |             2 |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birlaopus_selenium/com.BirlaOpus/src/test/resources/features/Compare_Product_Functionality.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@Report","id":"31c892c2-7541-4ef3-9f09-b63c6d19a845"}],"language":"en","keyword":"Feature","name":"To Validate Compare Product Functionality(Two Product)","description":"","children":[{"scenario":{"location":{"line":5,"column":3},"tags":[],"keyword":"Scenario Outline","name":"To verify that user can add a product to the comparison list","description":"","steps":[{"location":{"line":6,"column":5},"keyword":"Given ","keywordType":"Context","text":"User is on first product url \"CompareFirstProductUrl\" and adds first product \"<FirstProduct>\" to the comparison list","id":"939a9274-aa9b-4f31-9d7c-b86d174d2d7d"},{"location":{"line":7,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"User is on second product url \"CompareSecondProductUrl\" and adds second product \"<SecondProduct>\" to the comparison list","id":"39087b65-2696-4405-b5e3-53ea67fa8714"},{"location":{"line":8,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"the compare counter should display \"<ExpectedCount>\"","id":"278c1fac-67c6-4e6d-8234-b6575d5aa098"},{"location":{"line":9,"column":5},"keyword":  see an error message indicating the User already exists \"User already exists!!!\""}],"tags":[{"name":"@Report","astNodeId":"f96bec9f-ae09-4532-bc97-b8df7fe2ea60"}],"astNodeIds":["8413c84b-3a93-406f-a602-df1045e59953"]}},{"source":{"uri":"file:///C:/Backup/Birlaopus_selenium/com.BirlaOpus/src/test/resources/features/End_to_End_%20Profuct_Journey.feature","data":"@Report\nFeature: To Validate the Shop Happy End-to-End Product Journey Flow for an Existing User\n\n  Background: \n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n\n  #---------------------------------- Scenario 1 ----------------------------------#\n  Scenario Outline: To verify the end-to-end product journey through the checkout process with valid data for a logged-in user through navigation\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    #And User click on whishlist icon\n    And User increase the product quantity \"<desiredQuantity>\"\n    Then User clicks on the Proceed to Enter Address button\n    And User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available\n    And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed\n    Then User clicks on the Edit button to update the shipping details.\n    And User enters a valid first name for the updated shipping address\n    And User enters a valid last name for the updated shipping address\n    And User enters a valid mobile number for the updated shipping address\n    And User enters a valid shipping address \"<address>\"\n    And User clicks on the Submit button to update the details.\n    And User clicks on the Proceed to Shipment button\n    Then User clicks on the Proceed to payment button\n\n    Examples: \n      | navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               5 | Mumbai  |                5 |\n\n  #---------------------------------- Scenario 2 ----------------------------------#\n  Scenario Outline: To verify that the logged-in user continues shopping and completes checkout successfully via the Continue Shopping button\n    And User clicks the cart icon on the header and removes the product from the cart if available\n    Then User clicks on continue shopping button\n    And User select product category \"<productcategory>\"\n    Then User select product and click shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    And User increase the product quantity \"<desiredQuantity>\"\n    Then User clicks on the Proceed to Enter Address button\n    And User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available\n    And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed\n    And User clicks on the Proceed to Shipment button\n    Then User clicks on the Proceed to payment button\n\n    Examples: \n      | Colour    | quantity | pack | pincode | desiredQuantity | address | expectedQuantity | productcategory |\n      | Rose dust |        1 |    1 |  400703 |               2 | Mumbai  |                2 | Interior Paints |\n@test\n  #---------------------------------- Scenario 3 ----------------------------------#\n  Scenario Outline: To verify the end-to-end product journey through the checkout process with valid data for a logged-in user using the search bar\n    And User clicks the cart icon on the header and removes the product from the cart if available\n    When User clicks on the search icon\n    Then User enters the product name \"<searchfor>\" in the search box\n#And User select product category \"<category>\"\n    And User selects and clicks on the product\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    And User increase the product quantity \"<desiredQuantity>\"\n    Then User clicks on the Proceed to Enter Address button\n    And User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available\n    And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed\n    And User clicks on the Proceed to Shipment button\n    Then User clicks on the Proceed to payment button\n\n    Examples: -------------------->\n  Scenario Outline: To Verify successful submission of the Get in Touch form with updated mandatory data\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When User hovers over the Get in Touch popup\n    And User clicks on the Get in Touch option\n    And User updates the mandatory field Name\n    And User updates the mandatory field Email\n    And User updates the mandatory field Phone Number\n    And User updates the mandatory field Pincode \"<Pincode>\"\n    And User clicks submits the Get in Touch form\n    And User should see the acknowledgment message after successful submission\n\n    Examples: \n      | Pincode |\n      |  400001 |\n@test\n  #----------------------------------2---------------------------------------------------->\n  Scenario Outline: To Verify validation message is displayed when user enters an invalid pincode\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When User hovers over the Get in Touch popup\n    And User clicks on the Get in Touch option\n    And User updates the mandatory field Pincode \"<Pincode>\"\n    And User clicks submits the Get in Touch form\n    Then validation message for invalid pincode input field should get displayed \"Please enter a valid Pincode\"\n\n    Examples: \n      | Pincode |\n      |   40000 |\n\n  #----------------------------------3---------------------------------------------------->\n g the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    And the User should successfully sign in\n\n  #---------------------------------- Scenario 2 ----------------------------------#\n  Scenario Outline: To Verify sign-in form with invalid mobile number\n    And User enters invalid mobile number \"<mobile number>\" on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    Then Validation message mobile number should get displayed to user \"Please enter valid mobile number\"\n\n    Examples: \n      | mobile number |\n      |         12345 |\n\n  #---------------------------------- Scenario 3 ----------------------------------#\n  Scenario Outline: To Verify sign-in form with empty mobile number field\n    And User enters invalid mobile number \"<mobile number>\" on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    Then Validation message mobile number filed empty should get displayed to user \"This field is required\"\n\n    Examples: \n      | mobile number |\n      |               |\n\n  #---------------------------------- Scenario 4 ----------------------------------#\n  Scenario Outline: To verify user is able to log out successfully\n    And User enters valid mobile number mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    And User clicks on the Go to my profile button\n    When User clicks on the Sign Out button\n    Then User should see a popup with the message Are you sure you want to logout? and selects \"<answer>\"\n    Then User should be logged out successfully\n\n    Examples: \n      | answer |\n      | Yes    |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birlaopus_selenium/com.BirlaOpus/src/test/resources/features/Sign_In_Functionality n In button\n    And User enters valid mobile number mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When User hovers over the Get in Touch popup\n    Then User clicks on the Find a Store option\n    Then User enters a valid pincode \"<pincode>\"\n    And User clicks on the submit button\n    And User selects the first store and clicks the Get Number button\n    Then User clicks on the continue button\n    And User enters a valid email ID on the Store Locator lead details form\n    Then User clicks on the submit button on lead details form\n    And The confirmation message should be displayed successfully\n\n    Examples: \n      | pincode |\n      |  411033 |\n\n  #----------------------------------3---------------------------------------------------->\n  Scenario Outline: To verify validation message is displayed when user enters an invalid pincode(find store-without login)\n    When User hovers over the Get in Touch popup\n    Then User clicks on the Find a Store option\n    Then User enters a valid pincode \"<pincode>\"\n    And User clicks on the submit button\n    Then validation message for invalid pincode input field should get displayed \"Please enter a valid Pincode\"\n\n    Examples: \n      | pincode |\n      |   41103 |\n\n  #----------------------------------4---------------------------------------------------->\n  Scenario Outline: To verify validation message is displayed when pincode empty field (find store-without login)\n    When User hovers over the Get in Touch popup\n    Then User clicks on the Find a Store option\n    And User clicks on the submit button\n    Then validation message for empty pincode input field should get displayed \"This field is required\"\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birlaopus_seleniu the wishlist successfully\n    Then User click whishlist icon on top page\n    And User removes the product from the wishlist if it is already added \"<optionText>\"\n\n    Examples: \n      | navmenu  | navtab        | productname       | optionText       |\n      | Products | Waterproofing | Alldry Wall Fix 4 | Delete a Product |\n\n  #---------------------------------- Scenario 2 ----------------------------------#\n  Scenario Outline: To verify successful remove-to-wishlist functionality through navigation for a logged-in user.\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    And User click whishlist icon on product\n    Then User click whishlist icon on top page\n    And User removes the product from the wishlist if it is already added \"<optionText>\"\n    Then Product should be removed from the wishlist successfully\n\n    Examples: \n      | navmenu  | navtab        | productname       | optionText       |\n      | Products | Waterproofing | Alldry Wall Fix 4 | Delete a Product |\n\n  #---------------------------------- Scenario 3 ----------------------------------#\n  Scenario Outline: To verify wishlist add and remove functionality through search bar for a logged-in user\n    When User clicks on the search icon\n    Then User enters the product name \"<searchfor>\" in the search box\n    And User selects and clicks on the product\n    And User click whishlist icon on product\n    Then Product should be added to the wishlist successfully\n    Then User click whishlist icon on top page\n    And User removes the product from the wishlist if it is already added \"<optionText>\"\n    Then Product should be removed from the wishlist successfully\n\n    Examples: \n      | navmenu  | navtab        | productname       | optionText       | searchfor       |\n      | Products | Waterproofing | Alldry Wall Fix 4 | Delete a Product | Interior paints |\n","me
