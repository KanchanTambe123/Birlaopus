ype":"Action","text":"User hovers over the Get in Touch popup"},{"astNodeIds":["63c5c011-967d-4014-aa89-50a3c2bfc63a"],"id":"18710e0f-fce8-4ab4-acc5-7f2f9c185a27","type":"Action","text":"User clicks on the Get in Touch option"},{"astNodeIds":["52aae0b4-3b13-4149-8861-b673d118c734"],"id":"5f158032-d580-4eba-af2e-46ae0076f02e","type":"Action","text":"User clicks submits the Get in Touch form"},{"astNodeIds":["84462b82-e8bc-4725-a2ef-15e7c7ba3919"],"id":"780b1d3b-3707-4289-9c22-7135e0122238","type":"Outcome","text":"validation message for all input field should get displayed \"This field is required\""}],"tags":[{"name":"@module","astNodeId":"6bccdeb5-8b2f-4a97-adde-593a9ff17b6f"}],"astNodeIds":["9424fc0c-d27f-4a41-8539-197d55facea5"]}},{"source":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/Opus_Assurance_Journey.feature","data":"@module\nFeature: To Validate Opus Assurance Journey Functionality\n\n  Background: \n    Given User is on Opus Assurance Journey \"AssuranceUrl\"\n\n  #---------------------------------- Scenario 1 ----------------------------------#\n  Scenario Outline: To verify the account creation functionality for a new user using a valid mobile number and OTP, with a non-serviceable pincode.\n    And User enter valid paintable area \"<paintable_area>\"\n    And User click on Next button\n    Then User should click on Yet to Start Cta\n    And User click on Pre-register now Cta\n    Then User clicks on the Create an account option\n    And User enters valid mobile number on the Create an Account\n    And User clicks on the Create an Account button\n    And User enters valid OTP and clicks on the Verify OTP button\n    #And User enters bypass OTP and clicks on the Verify OTP button\n    Then User enter valid first name\n    And User enter valid last name\n    And User enter valid email id\n    And User enter unserviceable pincode \"<pin_code>\"\n    Then User click on the Save Details button\n    #Then User click submit button on Address section page for opus assurance\n    #And User captures and validates API request and response for \"lead/shortForm\"\n    Then User should see the heading \"We're coming soon!\"\n    And User should see the message \"Birla Opus Assurance is currently not available in your location. We've noted your interest and will notify you as soon as we launch in your area.\"\n    When User clicks on the profile icon\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters a valid mobile number on the Sign In page after creating an account\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    When User clicks on the profile icon\n    And User clicks on the delete account option\n    Then User should see a popup with the message Are you sure you want to delete your account? \"<answer>\"\n    And User enters valid OTP on profile page and clicks on the Verify OTP button\n\n    Examples: \n      | paintable_area | pin_code | answer |\n      | 2500 sqft      |   111222 | Yes    |\n\n  #---------------------------------- Scenario 2 ----------------------------------#\n  Scenario Outline: To verify whether user is able to see error message for email id field when user enter invalid email id\n    And User enter valid paintable area \"<paintable_area>\"\n    And User click on Next button\n    Then User should click on Yet to Start Cta\n    And User click on Pre-register now Cta\n    Then User clicks on the Create an account option\n    And User enters valid mobile number on the Create an Account\n    And User clicks on the Create an Account button\n    And User enters valid OTP and clicks on the Verify OTP button\n    #And User enters bypass OTP and clicks on the Verify OTP button\n    Then User enter valid first name\n    And User enter valid last name\n    And User enter invalid email id \"<invalid_email_id>\"\n    And User should see an error message for email id \"Invalid Input\"\n    And User enter valid pin code \"<pin_code>\"\n    Then User click on the Save Details button\n\n    Examples: \n      | paintable_area | invalid_email_id | pin_code | answer |\n      | 2500 sqft      | testestgmail.com | 400 060  | Yes    |\n\n  #---------------------------------- Scenario 3 ----------------------------------#\n  Scenario Outline: To verify whether user is able to see error message for last name when user enter invalid last name\n    And User enter valid paintable area \"<paintable_area>\"\n    And User click on Next button\n    Then User should click on Yet to Start Cta\n    And User click on Pre-register now Cta\n    Then User clicks on the Create an account option\n    And User enters valid mobile number on the Create an Account\n    And User clicks on the Create an Account button\n    And User enters valid OTP and clicks on the Verify OTP button\n    #And User enters bypass OTP and clicks on the Verify OTP button\n    Then User enter valid first name\n    And User enter invalid last name \"<invalid_last_name>\"\n    And User enter valid email id\n    And User enter valid pin code \"<pin_code>\"\n    Then User click on the Save Details button\n    And User should see an error message for last name \"This field is required.\"\n\n    Examples: \n      | paintable_area | invalid_last_name | invalid_email_id | pin_code |\n      | 2500 sqft      | @@@@@@@@@@@       | testestgmail.com | 400 060  |\n\n  #---------------------------------- Scenario 4 ----------------------------------#\n  Scenario Outline: To verify whether user is able to see error message for first name when user enter invalid first name\n    And User enter valid paintable area \"<paintable_area>\"\n    And User click on Next button\n    Then User should click on Yet to Start Cta\n    And User click on Pre-register now Cta\n    Then User clicks on the Create an account option\n    And User enters valid mobile number on the Create an Account\n    And User clicks on the Create an Account button\n    And User enters valid OTP and clicks on the Verify OTP button\n    #And User enters bypass OTP and clicks on the Verify OTP button\n    Then User enter invalid first name \"<invalid_first_name>\"\n    And User enter valid last name\n    And User enter valid email id\n    And User enter valid pin code \"<pin_code>\"\n    Then User click on the Save Details button\n    And User should see an error message for first name \"This field is required.\"\n\n    Examples: \n      | paintable_area | invalid_first_name | pin_code |\n      | 2500 sqft      | @@@@@@@@@@@        | 400 060  |\n\n  #---------------------------------- Scenario 5 ----------------------------------#\n  Scenario Outline: To Verify that an error message is displayed when the user enters an wrong OTP.\n    And User enter valid paintable area \"<paintable_area>\"\n    And User click on Next button\n    Then User should click on Yet to Start Cta\n    And User click on Pre-register now Cta\n    Then User clicks on the Create an account option\n    And User enters valid mobile number on the Create an Account\n    And User clicks on the Create an Account button\n    And User enter wrong otp \"<wrong_otp>\"\n    And User click on verify otp cta\n    Then User should see an error message for otp \"OTP does not match.\"\n\n    Examples: \n      | paintable_area | wrong_otp |\n      | 2500 sqft      |      2222 |\n\n  #---------------------------------- Scenario 6 ----------------------------------#\n  Scenario Outline: To verify that the user is shown an error message when the paintable area is less than 2000 sq ft\n    And User enter paintable area \"<paintable_area>\"\n    Then User should see an error message for paintable area  \"Paintable area should be more than or equal to 2000 sqft to avail Opus Assurance\"\n\n    Examples: \n      | paintable_area | pin_code |\n      | 1000 sqft      | 400 060  |\n\n  #---------------------------------- Scenario 7 ----------------------------------#\n  Scenario Outline: To verify that an existing user can complete the end-to-end flow by submitting all mandatory details (new project-Sign Up for PaintCraft button)\n    Given User enter valid paintable area \"<paintable_area>\"\n    And User click on Next button\n    Then User should click on Yet to Start Cta\n    And User click on Pre-register now Cta\n    And User enter valid mobile number on sign in \"<valid_mobile_no>\"\n    And User click on sign in button\n    And User enter valid otp \"<valid_otp>\"\n    And User click on verify otp button\n    #Then User click on start new project\n    And User enter valid pin code on enter details \"<pin_code>\"\n    Then User click on submit button on enter details\n    And User enter Site Details project name\n    And User enter update pin code on site details \"<Update_pin_code>\"\n    Then User click submit button on Address section page for opus assurance\n    And User captures and validates API request and response for \"lead/shortForm\"\n    And verify the lead API parameters for opus assurance journey: iclLeadContextC against value \"<iclLeadContextC>\",  iclLeadTypeC against value \"<iclLeadTypeC>\",  iclSubType against value \"<iclSubType>\",  leadSubSource against value \"<leadSubSource>\"\n    And User click next button on Just a Few More Details\n    Then User clcik on Sign Up for PaintCraft button\n    Then User selects the painting requirement type \"<requirementType>\"\n    And User clicks on the project details next button\n    Then User select home configuration type \"<bhkType>\"\n    Then User enters the carpet area \"<carpetArea>\"\n    And User clicks on the project details next button\n    And User selects a schedule visit date and timeslot \"<time>\"\n    And User clicks on the Schedule button\n    Then Birla Opus Assurance confirmation message should be displayed successfully \"Thank you for signing up for Birla Opus Assurance!\"\n\n    Examples: \n      | paintable_area | pin_code | valid_mobile_no | valid_otp | Update_pin_code | requirementType | carpetArea | bhkType | time         | iclLeadContextC      | iclLeadTypeC             | iclSubType         | leadSubSource  |\n      | 2500 sqft      |   500002 |      9768531510 |      1111 |          500002 | Exteriors       |       1200 | 2 BHK   | 12 PM - 3 PM | Birla Opus Assurance | Painting Service Enquiry | Paintcraft Service | Opus Assurance |\n\n  #---------------------------------- Scenario 8 ----------------------------------#\n  # Scenario Outline: To verify that an existing user can complete the end-to-end flow by submitting all mandatory details (new project-Find Contractor button)\n  # Given User enter valid paintable area \"<paintable_area>\"\n  # And User click on Next button\n  #Then User should click on Yet to Start Cta\n  # And User click on Pre-register now Cta\n  #And User enter valid mobile number on sign in \"<valid_mobile_no>\"\n  # And User click on sign in button\n  # And User enter valid otp \"<valid_otp>\"\n  # And User click on verify otp button\n  # Then User click on start new project\n  # And User enter valid pin code on enter details \"<pin_code>\"\n  # Then User click on submit button on enter details\n  # And User enter Site Details project name\n  #And User enter update pin code on site details \"<Update_pin_code>\"\n  #Then User click submit button on Site Details\n  #And verify the lead API parameters for opus assurance journey: iclLeadContextC against value \"<iclLeadContextC>\",  iclLeadTypeC against value \"<iclLeadTypeC>\",  iclSubType against value \"<iclSubType>\",  leadSubSource against value \"<leadSubSource>\"\n  # And User click next button on Just a Few More Details\n  #Then User clcik on Find Contractor button\n  # And User selects a contractor as needed\n  #Then User click on Next button in Find Contractor section\n  #Then User selects the painting requirement type \"<requirementType>\"\n  # And User clicks on the project details next button\n  # Then User select home configuration type \"<bhkType>\"\n  #  Then User enters the carpet area \"<carpetArea>\"\n  # And User clicks on the project details next button\n  # And User selects a schedule visit date and timeslot \"<time>\"\n  # And User clicks on the Schedule button\n  # Then Birla Opus Assurance confirmation message should be displayed successfully\n  #Examples:\n  #  | paintable_area | pin_code | valid_mobile_no | valid_otp | Update_pin_code | requirementType | carpetArea | bhkType | time         | iclLeadContextC      | iclLeadTypeC             | iclSubType         | leadSubSource  |\n  #  | 2500 sqft      |   500002 |      7019144066 |      1111 |          500002 | Exteriors       |       1200 | 2 BHK   | 12 PM - 3 PM | Birla Opus Assurance | Painting Service Enquiry | Paintcraft Service | Opus Assurance |\n  #---------------------------------- Scenario 9 ----------------------------------#\n  #Scenario Outline: To verify that a new user can complete the end-to-end flow by submitting all mandatory details (create an account – Sign Up for PaintCraft button).    Given User enter valid paintable area \"<paintable_area>\"\n  #Given User enter valid paintable area \"<paintable_area>\"\n  #And User click on Next button\n  #Then User should click on Yet to Start Cta\n  #And User click on Pre-register now Cta\n  #Then User clicks create an Account option\n  #And User enters valid mobile number on the Create an Account\n  #And User clicks on the Create an Account button\n  #And User enters valid OTP and clicks on the Verify OTP button\n  #And User enters bypass OTP and clicks on the Verify OTP button\n  #Then User enter valid first name\n  #And User enter valid last name\n  #And User enter valid email id\n  #And User enter valid pin code \"<pin_code>\"\n  #And User clicks on submit button on the Create an Account\n  #Then User clicks on tell us more about your site button\n  #And User enter Site Details project name\n  #And User enter flat number or bulding name \"<flat number>\"\n  #And User enter proerty name \"<property_name>\"\n  #Then User clicks on confirm and add address details\n  #And User enter update pin code on site details \"<Update_pin_code>\"\n  #Then User click submit button on Address section page for opus assurance\n  #And User captures and validates API request and response for \"lead/shortForm\"\n  #And User click next button on Just a Few More Details\n  #Then User clcik on Sign Up for PaintCraft button\n  #Then User selects the painting requirement type \"<requirementType>\"\n  #And User clicks on the project details next button\n  #Then User select home configuration type \"<bhkType>\"\n  #Then User enters the carpet area \"<carpetArea>\"\n  #And User clicks on the project details next button\n  #And User selects a schedule visit date and timeslot \"<time>\"\n  #And User clicks on the Schedule button\n  #Then Birla Opus Assurance confirmation message should be displayed successfully \"Thank you for signing up for Birla Opus Assurance!\"\n  #\n  #Examples:\n  #| paintable_area | pin_code | valid_mobile_no | valid_otp | Update_pin_code | requirementType | carpetArea | bhkType | time         | iclLeadContextC      | iclLeadTypeC             | iclSubType         | leadSubSource  | flat number | property_name |\n  #| 2500 sqft      |   500002 |      7019144066 |      1111 |          500002 | Exteriors       |       1200 | 2 BHK   | 12 PM - 3 PM | Birla Opus Assurance | Painting Service Enquiry | Paintcraft Service | Opus Assurance | B-10        | mumbai        |\n  #---------------------------------- Scenario 10----------------------------------#\n  Scenario Outline: To verify Clicking Pre-Register Now without login should open to login or register page\n    And User enter valid paintable area \"<paintable_area>\"\n    And User click on Next button\n    Then User should click on Yet to Start Cta\n    And User click on Pre-register now Cta\n    And User Login page should be displayed successfully\n\n    Examples: \n      | paintable_area |\n      | 2500 sqft      |\n\n  #---------------------------------- Scenario 11----------------------------------#\n  Scenario Outline: To verify that selecting more than 5 contractors is restricted\n    Given User enter valid paintable area \"<paintable_area>\"\n    And User click on Next button\n    Then User should click on Yet to Start Cta\n    And User click on Pre-register now Cta\n    And User enter valid mobile number on sign in \"<valid_mobile_no>\"\n    And User click on sign in button\n    And User enter valid otp \"<valid_otp>\"\n    And User click on verify otp button\n    #Then User click on start new project\n    And User enter valid pin code on enter details \"<pin_code>\"\n    Then User click on submit button on enter details\n    And User enter Site Details project name\n    And User enter update pin code on site details \"<Update_pin_code>\"\n    Then User click submit button on Address section page for opus assurance\n    And User captures and validates API request and response for \"lead/shortForm\"\n    And verify the lead API parameters for opus assurance journey: iclLeadContextC against value \"<iclLeadContextC>\",  iclLeadTypeC against value \"<iclLeadTypeC>\",  iclSubType against value \"<iclSubType>\",  leadSubSource against value \"<leadSubSource>\"\n    And User click next button on Just a Few More Details\n    Then User clcik on Find Contractor button\n    And User selects 6 contractors\n    Then User should not be able to select more than 5 contractors and validation message should be displayed \"Contractor select limit reached!\"\n\n    Examples: \n      | paintable_area | pin_code | valid_mobile_no | valid_otp | Update_pin_code | requirementType | carpetArea | bhkType | time         | iclLeadContextC      | iclLeadTypeC             | iclSubType         | leadSubSource  | flat number | property_name |\n      | 2500 sqft      |   500002 |      97685315 fb-6a9b-4536-82d2-9d030e2c3407","ddc4b209-2e4e-4155-95ba-11f185ca6ddc"],"id":"5cfba128-232b-460c-ab63-619d5b9ca07e","type":"Outcome","text":"User should see the heading \"We're coming soon!\""},{"astNodeIds":["f0f780a9-610e-4846-bb97-619533c7b3fb","ddc4b209-2e4e-4155-95ba-11f185ca6ddc"],"id":"3db0fa14-dc7a-46b9-a67c-eb154c63b25d","type":"Outcome","text":"User should see the message \"Birla Opus Assurance is currently not available in your location. We've noted your interest and will notify you as soon as we launch in your area.\""}],"tags":[{"name":"@module","astNodeId":"83a462ee-8964-4ee6-8884-4eba860fec51"}],"astNodeIds":["6b2b8cc5-4fac-4e69-bb6e-a83623ebba8c","ddc4b209-2e4e-4155-95ba-11f185ca6ddc"]}},{"source":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/Painting_Made_Easy.feature","data":"@module\r\nFeature: To Validate Painting Made Easy Form-Get Free Quote functionality\r\n\r\n  Background: \r\n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\r\n\r\n  #---------------------------------- Scenario 1 ----------------------------------#\r\n  Scenario Outline: To verify Painting made easy Get Free Quote flow including questionnaire, date & time selection, and confirmation for logged-in user\r\n    When User clicks on the profile icon\r\n    And User clicks on the Sign In button\r\n    And User enters valid mobile number on the Sign In page\r\n    And the User clicks on the Sign In button after entering the mobile number\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User clicks on the close icon\r\n    When User clicks on Painting made easy\r\n    Then User clicks on Get free quote\r\n    Then User clicks on the Next button on Address section page\r\n    And User captures and validates API request and response for \"lead/shortForm\"\r\n    And verify the lead API parameters for Painting Made Easy form: iclLeadContextC against value \"<iclLeadContextC>\",  iclLeadTypeC against value \"<iclLeadTypeC>\",  iclSubType against value \"<iclSubType>\",  leadSubSource against value \"<leadSubSource>\"\r\n    And User clicks on the Next button on the Share Few Details section\r\n    And User selects the painting requirement type \"<requirementType>\"\r\n    And User clicks on the project details next button\r\n    Then User select home configuration type \"<bhkType>\"\r\n    Then User enters the carpet area \"<carpetArea>\"\r\n    And User clicks on the project details next button\r\n    And User selects a schedule visit date and timeslot \"<time>\"\r\n    And User clicks on the Schedule button\r\n    Then A survey booking confirmation message should be displayed successfully \"Thank you for sharing your details & scheduling a survey with us!\"\r\n\r\n    Examples: \r\n      | requirementType | carpetArea | bhkType | address | pincode | iclLeadContextC    | iclLeadTypeC             | iclSubType         | leadSubSource      | time         |\r\n      | Exteriors       |       1200 | 2 BHK   | pune    |  400066 | Paintcraft Service | Painting Service Enquiry | Paintcraft Service | Painting made easy | 12 PM - 3 PM |\r\n\r\n  #---------------------------------- Scenario 2 ----------------------------------#\r\n  Scenario Outline: To verify thank you pop-up appears when user selects I’ll do it later option\r\n    When User clicks on the profile icon\r\n    And User clicks on the Sign In button\r\n    And User enters valid mobile number on the Sign In page\r\n    And the User clicks on the Sign In button after entering the mobile number\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User clicks on the close icon\r\n    When User clicks on Painting made easy\r\n    Then User clicks on Get free quote\r\n    Then User clicks on the Next button on Address section page\r\n    And User captures and validates API request and response for \"lead/shortForm\"\r\n    Then User clicks on the I’ll do it later option\r\n    Then A survey booking confirmation message should be displayed successfully \"Thank you for sharing your details & scheduling a survey with us!\"\r\n\r\n  #---------------------------------- Scenario 3 ----------------------------------#\r\n  #Scenario Outline: To verify thank you pop-up is displayed when user skips all questions\r\n  #  When User clicks on the profile icon\r\n  # And User clicks on the Sign In button\r\n  # And User enters valid mobile number on the Sign In page\r\n  # And the User clicks on the Sign In button after entering the mobile number\r\n  # And User enters valid OTP and clicks on the Verify OTP button\r\n  #Then User clicks on the close icon\r\n  # When User clicks on Painting made easy\r\n  #Then User clicks on Get free quote\r\n  #Then User clicks on the Next button on Address section page\r\n  # And User clicks on the Next button on the Share Few Details section\r\n  #And User clicks on the Skip for now option in the painting requirements question\r\n  # And User clicks on the Skip for now option in the home configuration question\r\n  #Then A survey booking confirmation message should be displayed successfully\r\n  #---------------------------------- Scenario 4 ----------------------------------#\r\n  Scenario Outline: To verify pop-up is displayed when an unserviceable PIN code is entered\r\n    When User clicks on the profile icon\r\n    And User clicks on the Sign In button\r\n    And User enters valid mobile number on the Sign In page\r\n    And the User clicks on the Sign In button after entering the mobile number\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User clicks on the close icon\r\n    When User clicks on Painting made easy\r\n    Then User clicks on Get free quote\r\n    And User enters unserviceable Pin code \"<pincode>\"\r\n    Then User clicks on the Next button on Address section page\r\n    And User captures and validates API request and response for \"lead/shortForm\"\r\n    Then the unserviceable pin code message should be displayed \"Coming soon Painting services are currently not available in your area\"\r\n\r\n    Examples: \r\n      | pincode |\r\n      |  111222 |\r\n\r\n  #---------------------------------- Scenario 5----------------------------------#\r\n  Scenario Outline: To verify error message is displayed to the user when entered incorrect mobile number on create an account option\r\n    When User clicks on Painting made easy\r\n    Then User clicks on Get free quote\r\n    And User clicks on the Create an account option\r\n    And User enter invalid mobile number \"<invalid_mobile_no>\"\r\n    Then User should see an message Please enter valid mobile number \"Please enter valid mobile number\"\r\n\r\n    Examples: \r\n      | invalid_mobile_no |\r\n      |              4444 |\r\n\r\n  #---------------------------------- Scenario 6----------------------------------#\r\n  Scenario Outline: To verify error message is displayed to the user when entered incorrect first name\r\n    When User clicks on Painting made easy\r\n    Then User clicks on Get free quote\r\n    And User clicks on the Create an account option\r\n    And User enters valid mobile number on the Create an Account\r\n    And User clicks on the Create an Account button\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User enter invalid first name on painting made easy \"<invalid_first_name>\"\r\n    And User enter valid last name on painting made easy\r\n    And User enter valid email id on painting made easy\r\n    And User clicks on save details button\r\n    And User should see an error message for first name \"This field is required\"\r\n\r\n    Examples: \r\n      | invalid_first_name |\r\n      | @@@@@@@@@@@        |\r\n\r\n  #---------------------------------- Scenario 7 ----------------------------------#\r\n  Scenario Outline: To verify error message is displayed to the user when entered incorrect last name\r\n    When User clicks on Painting made easy\r\n    Then User clicks on Get free quote\r\n    And User clicks on the Create an account option\r\n    And User enters valid mobile number on the Create an Account\r\n    And User clicks on the Create an Account button\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User enter valid first name on painting made easy\r\n    And User enter invalid last name on painting made easy \"<invalid_last_name>\"\r\n    And User enter valid email id on painting made easy\r\n    And User clicks on save details button\r\n    And User should see an error message for last name \"This field is required\"\r\n\r\n    Examples: \r\n      | invalid_last_name |\r\n      | @@@@@@@@@@@       |\r\n\r\n  #---------------------------------- Scenario 8 ----------------------------------#\r\n  Scenario Outline: To verify error message is displayed to the user when entered incorrect email id\r\n    When User clicks on Painting made easy\r\n    Then User clicks on Get free quote\r\n    And User clicks on the Create an account option\r\n    And User enters valid mobile number on the Create an Account\r\n    And User clicks on the Create an Account button\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User enter valid first name on painting made easy\r\n    And User enter valid last name on painting made easy\r\n    And User enter invalid email id on painting made easy \"<invalid_email_id>\"\r\n    And User clicks on save details button\r\n    And User should see an error message for last name \"Please enter valid email address\"\r\n\r\n    Examples: \r\n      | invalid_email_id |\r\n      | testtestgmai.com |\r\n\r\n  #---------------------------------- Scenario 9 ----------------------------------#\r\n  Scenario Outline: To verify error message is displayed to the user when entered incorrect mobile number on sign-in\r\n    When User clicks on Painting made easy\r\n    Then User clicks on Get free quote\r\n    And Use  Scenario Outline: To verify pop-up is displayed when an unserviceable PIN code is entered\n    And User clicks on the Sign up for free button\n    And User enters a unservicable pin code \"<PinCode>\" in the Painting Service Form\n    And User clicks on the Submit button in the Painting Service Form\n    And User captures and validates API request and response for \"lead/shortForm\"\n    Then the unserviceable pin code message should be displayed \"Coming soon Painting services are currently not available in your area\"\n\n    Examples: \n      | PinCode |\n      |  111222 |\n\n  #----------------------------------Scenario 2----------------------------------#\n  Scenario Outline: To verify error message is displayed for an invalid pin code for a logged-in user\n    And User clicks on the Sign up for free button\n    And User enters an invalid pin code \"<PinCode>\" in the Painting Service Form\n    And User clicks on the Submit button in the Painting Service Form\n    Then An error message should be displayed for invalid pin code \"Please enter a invalid Pincode\"\n\n    Examples: \n      | PinCode |\n      |     123 |\n\n  #----------------------------------Scenario 3---------------------------------------------------->\n  Scenario Outline: To verify validation messages when mandatory fields are empty in Painting Service Request Form\n    And User clicks on the Sign up for free button\n    And User clicks on the Submit button in the Painting Service Form\n    And validation message for Pincode empty input fields should get displayed \"This field is required\"\n\n  #---------------------------------- Scenario 4 ----------------------------------#\n  Scenario Outline: To verify that the Back button works after entering form data in the Painting Service Request form\n    And User clicks on the Sign up for free button\n    And User clicks on the Back button\n    Then User should be navigated to the previous page\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherk umber>\" on the Sign In page\r\n    And the User clicks on the Sign In button after entering the mobile number\r\n    Then the validation message for an invalid mobile number should be displayed to the user \"Please enter valid mobile number\"\r\n\r\n    Examples: \r\n      | mobile number |\r\n      |    0987654321 |\r\n\r\n  #---------------------------------- Scenario 4 ----------------------------------#\r\n  Scenario Outline: To verify sign-in form with empty mobile number field (without mobile number)\r\n    And the User clicks on the Sign In button\r\n    Then Validation message mobile number filed empty should get displayed to user \"This field is required\"\r\n\r\n  #---------------------------------- Scenario 5 ----------------------------------#\r\n  Scenario Outline: To verify user is able to log out successfully\r\n    And User enters valid mobile number on the Sign In page\r\n    And the User clicks on the Sign In button after entering the mobile number\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    And User clicks on the Go to my profile button\r\n    When User clicks on the Log Out button\r\n    Then User should see a popup with the message Are you sure you want to logout? and selects \"<answer>\"\r\n\r\n    Examples: \r\n      | answer |\r\n      | Yes    |\r\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/Sign_In_Functionality.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@module","id":"037bd53c-7f3d-4c2f-aa37-21c8414fc0c8"}],"language":"en","keyword":"Feature","name":"To Validate Sign-In (User Login)Functionality","description":"","children":[{"background":{"location":{"line":4,"column":3},"keyword":"Background","name":"","description":"","steps":[{"location":{"line":5,"column":5},"keyword":"Given ","keywordType":"Context","text":"User is on BirlaOpus HomePage gation for a logged-in user.\r\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\r\n    And User click whishlist icon on product\r\n    Then User click whishlist icon on top page\r\n    And User clicks on \"<tabName>\" tab\r\n    And User removes the product from the wishlist if it is already added \"<optionText>\"\r\n    Then Product should be removed from the wishlist successfully\r\n\r\n    Examples: \r\n      | navmenu  | navtab        | productname       | optionText       | tabName    |\r\n      | Products | Waterproofing | Alldry Wall Fix 4 | Delete a Product | Favourites |\r\n\r\n  #---------------------------------- Scenario 3 ----------------------------------#\r\n  Scenario Outline: To verify wishlist add and remove functionality through search bar for a logged-in user\r\n    When User clicks on the search icon\r\n    Then User enters the product name \"<searchfor>\" in the search box\r\n    And User selects and clicks on the product\r\n    And User click whishlist icon on product\r\n    Then Product should be added to the wishlist successfully\r\n    Then User click whishlist icon on top page\r\n    And User clicks on \"<tabName>\" tab\r\n    And User removes the product from the wishlist if it is already added \"<optionText>\"\r\n    Then Product should be removed from the wishlist successfully\r\n\r\n    Examples: \r\n      | navmenu  | navtab        | productname       | optionText       | searchfor       | tabName    |\r\n      | Products | Waterproofing | Alldry Wall Fix 4 | Delete a Product | Interior paints | Favourites |\r\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/Wishlist_Functionality.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@module","id":"4d56144e-fc77-4de5-bf65-401522f
