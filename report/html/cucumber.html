 enters an invalid pincode on the Get in Touch form\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When User hovers over the Get in Touch popup\n    And User clicks on the Get in Touch option\n    And User updates the mandatory field Pincode \"<Pincode>\"\n    And User clicks submits the Get in Touch form\n    Then validation message for invalid pincode input field should get displayed \"Please enter a valid Pincode\"\n\n    Examples: \n      | Pincode |\n      |   40000 |\n\n  #----------------------------------3---------------------------------------------------->\n  Scenario Outline: To verify mandatory field validation messages on the Get in Touch form without login\n    When User hovers over the Get in Touch popup\n    And User clicks on the Get in Touch option\n    And User clicks submits the Get in Touch form\n    Then validation message for all input field should get displayed \"This field is required\"\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birla_Uat/Birlaopus_selenium/com.BirlaOpus/Birlaopus/src/test/resources/features/Get_Touch_Contact_Form.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@module","id":"997095cd-9403-49bc-b078-dce17b261130"}],"language":"en","keyword":"Feature","name":"To Validate Get in Touch Contact Form Subscription","description":"","children":[{"background":{"location":{"line":4,"column":3},"keyword":"Background","name":"","description":"","steps":[{"location":{"line":5,"column":5},"keyword":"Given ","keywordType":"Context","text":"User is on BirlaOpus HomePage \"birlaopusHomeUrl\"","id":"67f649a2-8e7f-4316-8494-23b4ed744a79"}],"id":"d32a22a
