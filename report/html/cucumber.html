window.CUCUMBER_MESSAGES = [{"meta":{"protocolVersion":"22.0.0","implementation":{"name":"cucumber-jvm","version":"7.15.0"},"runtime":{"name":"Java HotSpot(TM) 64-Bit Server VM","version":"11.0.19+9-LTS-224"},"os":{"name":"Windows 11"},"cpu":{"name":"amd64"}}},{"testRunStarted":{"timestamp":{"seconds":1790251862,"nanos":679203600}}},{"source":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/All_Lets_Connect_Form.feature","data":"@module\nFeature: To Validate the Brand section Form and Book a Free Consultation form on the homepage.\n\n  Background: \n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n\n  #----------------------------------1---------------------------------------------------->\n  Scenario Outline: To verify mandatory fields with valid data on the Let’s Connect form in the Brands section for a logged-in user\n    Given User is on the Birla Opus Brands page  \"BrandUrl\"\n    And User navigates to the Let’s Connect form section\n    #And User enters a valid Name on the Let’s Connect form Brands\n    When User selects \"<HelpOption>\" from the How can we help you? dropdown\n    And User enters a valid Pincode on the Let’s Connect form Brands \"<Pincode>\"\n    And User clicks on the Submit button\n    And User captures and validates API request and response for \"lead/shortForm\"\n    #And verify the lead API parameters for Brands Enquiry form  : iclLeadContextC against value \"<iclLeadContextC>\",  iclLeadTypeC against value \"<iclLeadTypeC>\",  iclSubType against value \"<iclSubType>\",  leadSubSource against value \"<leadSubSource>\"\n    And User should see the acknowledgment message after successful submission \"Thank You For Reaching out to us !\"\n\n    Examples: \n      | HelpOption      | Pincode |\n      | Product Enquiry |  400703 |\n\n  #----------------------------------2---------------------------------------------------->\n  Scenario Outline: To verify validation messages when mandatory fields are empty in Let’s Connect form (Brands)\n    Given User is on the Birla Opus Brands page  \"BrandUrl\"\n    And User clicks on the Submit button\n    #And validation message for Name input fields should get displayed \"This field is required\"\n    And validation message for HelpOption input fields should get displayed \"This field is required\"\n    And validation message for Pincode input fields should get displayed \"This field is required\"\n\n  #----------------------------------3---------------------------------------------------->\n  #Scenario Outline: To verify mandatory fields with valid data on the Let’s Connect form (Become a dealer)\n  #Given User is on the Birla Opus Become a dealer page  \"BecomedealerUrl\"\n  # When User selects Become a dealer Let’s Connect form \"<UserType>\" from the Who are you ? dropdown\n  # And User selects Become a dealer Let’s Connect form \"<HelpOption>\" from the How can we help you? dropdown\n  # And User enters a valid Pincode on the Become a dealer Let’s Connect form  \"<Pincode>\"\n  # And User clicks on the Submit button\n  #And User should see the acknowledgment message after successful submission\n  #Examples:\n  # | UserType             | Pincode | HelpOption                 |\n  # | Dealer / Retailer    |  411033 | Become a Dealer            |\n  # | Painter / Contractor |  400703 | Complaints / Feedback      |\n  #| Designer / AID       |  411033 | General Enquiries / Others |\n  #----------------------------------4---------------------------------------------------->\n  #Scenario Outline: To verify mandatory fields with valid data on the Let’s Connect form (Become a contractor)\n  # G "d8b97764-9882-49e3-af8d-db022b72c45d"],"id":"1024212a-5991-4f6b-b444-e949373fc54a","type":"Outcome","text":"User clicks on the close icon"},{"astNodeIds":["a7f604c6-f0d7-42ef-bf3d-43600d2ab3d7","9a6332f3-45b1-470d-a131-1d235b69ef84"],"id":"3e97d64d-7c96-4be1-accf-26c5e5a5a34f","type":"Outcome","text":"User navigates to the Book a free consultation form section"},{"astNodeIds":["6fa178ac-5c13-42c7-b966-47dc0424013b","9a6332f3-45b1-470d-a131-1d235b69ef84"],"id":"c8cc56f0-93c8-4342-818d-e6fa94a1ca23","type":"Outcome","text":"User clicks on Book a Free Consultation button"},{"astNodeIds":["7f70c232-b0da-423c-b6c8-f5fef9609173","9a6332f3-45b1-470d-a131-1d235b69ef84"],"id":"81cbaba3-47d2-44d1-8286-12b9932619bc","type":"Outcome","text":"User enters a invalid pincode on the Book a Free Consultation form  \"123\""},{"astNodeIds":["92115651-5ac1-4fa7-abde-d38bab9e000d","9a6332f3-45b1-470d-a131-1d235b69ef84"],"id":"825b3334-0ff8-4789-b100-ac43a2f80763","type":"Outcome","text":"the user clicks on the Continue button on the Book a Free Consultation form"},{"astNodeIds":["5d12f83d-0ea4-4f5e-97ed-a8aa0b176eba","9a6332f3-45b1-470d-a131-1d235b69ef84"],"id":"ace161f4-4730-4f0e-9b04-5ec03b1e1b1d","type":"Outcome","text":"error message should be displayed for invalid pin code \"Please enter a valid Pincode\""}],"tags":[{"name":"@module","astNodeId":"a629d82b-5a16-4b1a-aee0-c13e1c2204ab"}],"astNodeIds":["b912d684-7796-4e1d-b7ff-8dc2f8870620","9a6332f3-45b1-470d-a131-1d235b69ef84"]}},{"source":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/Booking_Free_Survey_Form.feature","data":"@module\r\nFeature: To Validate Survey Booking Form\r\n\r\n  Background: \r\n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\r\n    When User clicks on the profile icon\r\n    And User clicks on the Sign In button\r\n    And User enters valid mobile number on the Sign In page\r\n    And the User clicks on the Sign In button after entering the mobile number\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User clicks on the close icon\r\n\r\n  #---------------------------------- Scenario 1 ----------------------------------#\r\n  Scenario Outline: To verify successful submission of the survey booking form for a logged-in user\r\n    And User clicks on the Book a Free Survey button\r\n    #And User select property name and address \"<address>\"\r\n    #Then User click on address confirm button\r\n    #And User enters the survey Pincode \"<pincode>\"\r\n    Then User clicks on the Next button on Address section page\r\n    And User captures and validates API request and response for \"lead/shortForm\"\r\n    And verify the lead API parameters for booking a free survey: iclLeadContextC against value \"<iclLeadContextC>\",  iclLeadTypeC against value \"<iclLeadTypeC>\",  iclSubType against value \"<iclSubType>\",  leadSubSource against value \"<leadSubSource>\"\r\n    And User clicks on the Next button on the Share Few Details section\r\n    Then User selects the painting requirement type \"<requirementType>\"\r\n    And User clicks on the project details next button\r\n    Then User select home configuration type \"<bhkType>\"\r\n    Then User enters the carpet area \"<carpetArea>\"\r\n    And User clicks on the project details next button\r\n    And User selects a schedule visit date and timeslot \"<time>\"\r\n    And User clicks on the Schedule button\r\n    Then A survey booking confirmation message should be displayed successfully \"Thank you for sharing your details & scheduling a survey with us!\"\r\n\r\n    Examples: \r\n      | requirementType | carpetArea | bhkType | address | pincode | iclLeadContextC    | iclLeadTypeC             | iclSubType         | leadSubSource      | time         |\r\n      | Exteriors       |       1200 | 2 BHK   | pune    |  411033 | Paintcraft Service | Painting Service Enquiry | Paintcraft Service | Book a free survey | 12 PM - 3 PM |\r\n\r\n  #---------------------------------- Scenario 2 ----------------------------------#\r\n  Scenario Outline: To verify that the user navigates to the previous step using the Back button on the survey booking form\r\n    When User clicks on the Book a Free Survey button\r\n    Then User clicks on the Next button on Address section page\r\n    And User clicks on the Back button on the Address section page\r\n    Then User should be redirected to the previous step of the Book a Free Survey form\r\n\r\n  #---------------------------------- Scenario 3 ----------------------------------#\r\n  Scenario Outline: To verify thank you pop-up appears when user selects I’ll do it later option\r\n    And User clicks on the Book a Free Survey button\r\n    Then User clicks on the Next button on Address section page\r\n    And User captures and validates API request and response for \"lead/shortForm\"\r\n    Then User clicks on the I’ll do it later option\r\n    Then A survey booking confirmation message should be displayed successfully \"Thank you for sharing your details & scheduling a survey with us!\"\r\n\r\n  #---------------------------------- Scenario 4 ----------------------------------#\r\n  # Scenario Outline: To verify thank you pop-up is displayed when user skips all questions\r\n  # And User clicks on the Book a Free Survey button\r\n  # Then User clicks on the Next button on Address section page\r\n  #And User clicks on the Next button on the Share Few Details section\r\n  # Then User selects the painting requirement type \"<requirementType>\"\r\n  #And User clicks on the Skip for now option in the painting requirements question\r\n  # And User clicks on the Skip for now option in the home configuration question\r\n  #Then A survey booking confirmation message should be displayed successfully\r\n  \r\n\r\n  #---------------------------------- Scenario 5 ----------------------------------#\r\n  Scenario Outline: To verify pop-up is displayed when an unserviceable PIN code is entered\r\n    And User clicks on the Book a Free Survey button\r\n    And User enters unserviceable Pin code \"<pincode>\"\r\n    Then User clicks on the Next button on Address section page\r\n    And User captures and validates API request and response for \"lead/shortForm\"\r\n    Then the unserviceable pin code message should be displayed \"Coming soon Painting services are currently not available in your area\"\r\n\r\n    Examples: \r\n      | pincode |\r\n      |  111222 |\r\n  #---------------------------------- Scenario 5 ----------------------------------#\r\n  #Scenario Outline: To Verify address section with valid and invalid inputs\r\n    #And User clicks on the Book a Free Survey button\r\n    #When User enters \"<FlatNo>\" in Flat no / building name field\r\n    #And User enters \"<AddressLine1>\" in Property name / Address line 1 field\r\n    #And User selects location using \"<MapOption>\"\r\n    #And User enters \"<City>\" in City field\r\n    #And User enters \"<State>\" in State field\r\n    #And User enters \"<Pincode>\" in Pincode field\r\n    #Then User clicks on the Next button on the Book a Free Survey form\r\n    #Then \"<ExpectedResult>\" should be displayed\r\n#\r\n    #Examples: \r\n      #| FlatNo | AddressLine1                 | MapOption      | City   | State       | Pincode | ExpectedResult                |\r\n      #| test   | Testtex Laboratories Pvt Ltd | Locate on maps | Mumbai | Maharashtra |  500001 | Address saved successfully    |\r\n      #|        | Testtex Laboratories Pvt Ltd | Locate on maps | Mumbai | Maharashtra |  500001 | This field is required.       |\r\n      #| test   |                              | Locate on maps | Mumbai | Maharashtra |  500001 | This field is required.       |\r\n      #| test   | Testtex Laboratories Pvt Ltd | Locate on maps | Mumbai | Maharashtra |         | This field is required.       |\r\n      #| test   | Testtex Laboratories Pvt Ltd | Locate on maps | Mumbai | Maharashtra |     123 | Invalid I ---- Scenario 1 ----------------------------------#\n  Scenario Outline: To validate Budget Calculator functionality using valid mandatory data\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When the User scrolls to the Budget Calculator\n    Then the User selects the space name to paint \"<spaceName>\"\n    And the User enters a valid carpet area \"<carpetArea>\"\n    And the User enters a valid serviceable pincode \"<pincode>\"\n    Then the User clicks on the Calculate Now button\n    # And the calculation result correctly reflects the entered carpet area and pincode\n    Then click on Budget Calculator book free survey button\n    Then User clicks on the Next button on Address section page\n    And User captures and validates API request and response for \"lead/shortForm\"\n    And verify the lead API parameters for Budget Calculator form: iclLeadContextC against value \"<iclLeadContextC>\",  iclLeadTypeC against value \"<iclLeadTypeC>\",  iclSubType against value \"<iclSubType>\",  leadSubSource against value \"<leadSubSource>\"\n    And User clicks on the Next button on the Share Few Details section\n    And User selects the painting requirement type \"<requirementType>\"\n    And User clicks on the project details next button\n    Then User select home configuration type \"<bhkType>\"\n    Then User enters the carpet area \"<carpetArea>\"\n    And User clicks on the project details next button\n    And User selects a schedule visit date and timeslot \"<time>\"\n    And User clicks on the Schedule button\n    Then A survey booking confirmation message should be displayed successfully \"Thank you for sharing your details & scheduling a survey with us!\"\n\n    Examples: \n      | spaceName         | carpetArea | pincode | requirementType | bhkType | address | iclLeadContextC    | iclLeadTypeC             | iclSubType         | leadSubSource     | time         |\n      | Villa or Bungalow |       1000 |  500001 | Exteriors       | 2 BHK   | pune    | Paintcraft Service | Painting Service Enquiry | Paintcraft Service | Budget Calculator | 12 PM - 3 PM |\n\n  #---------------------------------- Scenario 2 ----------------------------------#\n  Scenario Outline: To verify other categories remain locked when Premium category is selected without login\n    When the User scrolls to the Budget Calculator\n    Then the User selects the space name to paint \"<spaceName>\"\n    And the User enters a valid carpet area \"<carpetArea>\"\n    And the User enters a valid serviceable pincode \"<pincode>\"\n    Then the User clicks on the Calculate Now button\n    Then the Economy and Luxury categories should be displayed as locked\n\n    Examples: \n      | spaceName         | carpetArea | pincode |\n      | Villa or Bungalow |       1000 |  500001 |\n\n  #---------------------------------- Scenario 3 ----------------------------------#\n  Scenario Outline: To verify Book a Free Survey button visibility on other tabs after booking a survey from the Premium tab\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When the User scrolls to the Budget Calculator\n    Then the User selects the space name to paint \"<spaceName>\"\n    And the User enters a valid carpet area \"<carpetArea>\"\n    And the User enters a valid serviceable pincode \"<pincode>\"\n    Then the User clicks on the Calculate Now button\n    Then click on Budget Calculator book free survey button\n    Then User clicks on the Next button on Address section page\n    And User captures and validates API request and response for \"lead/shortForm\"\n    Then User clicks on the I’ll do it later option\n    Then the User clicks on the Thank You window close icon\n    Then the Book a free survey button should not be visible on the Premium tab\n    And the Book a free survey button should be visible on the Economy tab\n    And the Book a free survey button should be visible on the Luxury tab\n\n    Examples: \n      | spaceName         | carpetArea | pincode | requirementType | bhkType | address | iclLeadContextC    | iclLeadTypeC             | iclSubType         | leadSubSource     | time         |\n      | Villa or Bungalow |       1000 |  500001 | Exteriors       | 2 BHK   | pune    | Paintcraft Service | Painting Service Enquiry | Paintcraft Service | Budget Calculator | 12 PM - 3 PM |\n\n  #---------------------------------- Scenario 4 ----------------------------------#\n  Scenario Outline: To verify thank you pop-up appears when user selects I’ll do it later option\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When the User scrolls to the Budget Calculator\n    Then the User selects the space name to paint \"<spaceName>\"\n    And the User enters a valid carpet area \"<carpetArea>\"\n    And the User enters a valid serviceable pincode \"<pincode>\"\n    Then the User clicks on the Calculate Now button\n    # And the calculation result correctly reflects the entered carpet area and pincode\n    Then click on Budget Calculator book free survey button\n    Then User clicks on the Next button on Address section page\n    And User captures and validates API request and response for \"lead/shortForm\"\n    Then User clicks on the I’ll do it later option\n    Then A survey booking confirmation message should be displayed successfully \"Thank you for sharing your details & scheduling a survey with us!\"\n\n    Examples: \n      | spaceName         | carpetArea | pincode | requirementType | bhkType | address | iclLeadContextC    | iclLeadTypeC             | iclSubType         | leadSubSource     | time         |\n      | Villa or Bungalow |       1000 |  500001 | Exteriors       | 2 BHK   | pune    | Paintcraft Service | Painting Service Enquiry | Paintcraft Service | Budget Calculator | 12 PM - 3 PM |\n\n  #---------------------------------- Scenario 5----------------------------------#\n  #Scenario Outline: To verify thank you pop-up is displayed when user skips all questions\n  # When the User scrolls to the Budget Calculator\n  #Then the User selects the space name to paint \"<spaceName>\"\n  #And the User enters a valid carpet area \"<carpetArea>\"\n  #And the User enters a valid serviceable pincode \"<pincode>\"\n  #Then the User clicks on the Calculate Now button\n  #Then click on Budget Calculator book free survey button\n  #Then User clicks on the Next button on the Book a Free Survey form\n  # And User clicks on the Next button on the Share Few Details section\n  #And User clicks on the Skip for now option in the painting requirements question\n  #And User clicks on the Skip for now option in the home configuration question\n  # Then A survey booking confirmation message should be displayed successfully\n  #Examples:\n  # | spaceName         | carpetArea | pincode | requirementType | bhkType | address | iclLeadContextC    | iclLeadTypeC             | iclSubType         | leadSubSource     | time         |\n  #| Villa or Bungalow |       1000 |  500001| Exteriors       | 2 BHK   | pune    | Paintcraft Service | Painting Service Enquiry | Paintcraft Service | Budget Calculator | 12 PM - 3 PM |\n  #---------------------------------- Scenario 6----------------------------------#\n  Scenario Outline: To verify pop-up is displayed when an unserviceable PIN code is entered\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When the User scrolls to the Budget Calculator\n    Then the User selects the space name to paint \"<spaceName>\"\n    And the User enters a valid carpet area \"<carpetArea>\"\n    And the User enters a valid serviceable pincode \"<pincode>\"\n    Then the User clicks on the Calculate Now button\n    Then click on Budget Calculator book free survey button\n    #Then User clicks on the Next button on the Book a Free Survey form\n    And User enters unserviceable Pin code on budget calculator form \"<Pincode_Unserviceable>\"\n    Then User clicks on the Next button on Address section page\n    And User captures and validates API request and response for \"lead/shortForm\"\n    Then the unserviceable pin code message should be displayed \"Coming soon Painting services are currently not available in your area\"\n\n    Examples: \n      | spaceName         | carpetArea | pincode | requirementType | bhkType | address | Pincode_Unserviceable |\n      | Villa or Bungalow |       1000 |  500001 | Exteriors       | 2 BHK   | pune    |                111222 |\n\n  #---------------------------------- Scenario 7----------------------------------#\n  Scenario Outline: To verify whether the carpet area can be edited and if the price updates correctly.\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When the User scrolls to the Budget Calculator\n    Then the User selects the space name to paint \"<spaceName>\"\n    And the User enters a valid carpet area \"<carpetArea>\"\n    And the User enters a valid serviceable pincode \"<pincode>\"\n    Then the User clicks on the Calculate Now button\n    And the User verifies the edit button is clickable and clicks on the carpet area edit button\n    And the User enters a valid Recalculate estimate carpet area \"<UpdatecarpetArea>\"\n    Then the User clicks on the Recalculate Estimate button and verifies the price is updated\n\n    Examples: \n      | spaceName         | carpetArea | pincode | requirementType | bhkType | address | UpdatecarpetArea |\n      | Villa or Bungalow |       2000 |  500001 | Exteriors       | 2 BHK   | pune    |             2500 |\n\n  #---------------------------------- Scenario 8----------------------------------#\n  Scenario Outline: To verify that an error message is displayed when an invalid pincode is entered.\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When the User scrolls to the Budget Calculator\n    And the User enters a invalid pincode \"<pincode>\"\n    Then the User should see the error message \"Invalid Input.\"\n\n    Examples: \n      | pincode |\n      |    4110 |\n      |       0 |\n\n  #---------------------------------- Scenario 9----------------------------------#\n  Scenario Outline: To verify error message when alphabet is entered in pincode field\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When the User scrolls to the Budget Calculator\n    And the User enters a invalid pincode \"<pincode>\"\n    Then the user should see the error message \"This field is required.\" when an alphabet is entered in the pincode field.\n\n    Examples: \n      | pincode |\n      | a       |\n\n  #---------------------------------- Scenario 10----------------------------------#\n  Scenario Outline: To verify that clicking on \"View Products\" displays products based on carpet area and a particular pincode(Premium category)\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When the User scrolls to the Budget Calculator\n    Then the User selects the space name to paint \"<spaceName>\"\n    And the User enters a valid carpet area \"<carpetArea>\"\n    And the User enters a valid serviceable pincode \"<pincode>\"\n    Then the User clicks on the Calculate Now button\n    And the User clicks on view products\n\n    #Then the User should see the list of products matching the carpet area \"<carpetArea>\" and pincode \"<pincode>\"\n    Examples: \n      | spaceName         | carpetArea | pincode |\n      | Villa or Bungalow |       2000 |  500001 |\n\n  #---------------------------------- Scenario 11----------------------------------#\n  Scenario Outline: To verify Download Estimate button is clickable\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User ent s/Cart_Functionality.feature","data":"@Scope1\nFeature: To Validate Cart Functionality – Add, Update, Remove and Price Validation (Single Product)\n\n  Background: \n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n\n  #----------------------------------1---------------------------------------------------->\n  Scenario Outline: To verify that a logged-in user can successfully add a product to the cart through navigation\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    Then Product should be added to the cart successfully\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n\n    Examples: \n      | navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               2 | Mumbai  |                2 |\n\n  #----------------------------------2---------------------------------------------------->\n  Scenario Outline: To verify that a logged-in user can successfully add a product to the cart through searchbar\n   Then User clicks the cart icon on the header and removes the product from the cart if available\n    \n    When User clicks on the search icon\n    Then User enters the product name \"<searchfor>\" in the search box\n    And User selects and clicks on the product\n    Then User click on Shop now button\n    Then User clcik on view all button\n    And User search Colour \"<search_colour>\"\n    #Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    Then Product should be added to the cart successfully\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n\n    Examples: \n      | searchfor          | Colour    | quantity | pack | pincode | search_colour |\n      | Calista Ever Clear | Rose dust |        1 |    1 |  411033 | Rose dust     |\n\n  #----------------------------------3---------------------------------------------------->\n  Scenario Outline: To verify that the total price is updated correctly when the product quantity is changed through navigation for a logged-in user\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    And User increase the product quantity \"<desiredQuantity>\"\n    #Then User clicks on the Proceed to Enter Address button\n    # And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n\n    Examples: \n      | navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               5 | Mumbai  |                5 |\n\n  #----------------------------------4---------------------------------------------------->\n  Scenario Outline: To verify that a logged-in user can remove a product from the header cart\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    And Cart count should be updated to \"<expectedCount>\"\n\n    Examples: \n      | navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity | address | expectedQuantity | expectedCount |\n      | Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               5 | Mumbai  |                5 |             0 |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/Cart_Functionality.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@Scope1","id":"65b9ad63-bf46-4870-9743-849f9b466 econd product \"<SecondProduct>\" to the comparison list\r\n    Then the compare counter should display \"<ExpectedCount>\"\r\n    And User can view the comparison page with the selected products\r\n\r\n    Examples: \r\n      | FirstProduct      | SecondProduct      | ExpectedCount |\r\n      | Style Color Smart | Style Super Bright |             2 |\r\n\r\n  #----------------------------------2---------------------------------------------------->\r\n  Scenario Outline: To verify that user can remove a product from the comparison list\r\n    Given User is on first product url \"CompareFirstProductUrl\" and adds first product \"<FirstProduct>\" to the comparison list\r\n    And User is on second product url \"CompareSecondProductUrl\" and adds second product \"<SecondProduct>\" to the comparison list\r\n    And User can view the comparison page with the selected products\r\n    When User removes \"<ProductToRemove>\" from the comparison list\r\n    Then the compare counter should display \"<ExpectedCountAfterRemove>\"\r\n    And The comparison list should contain \"<RemainingProduct>\"\r\n\r\n    Examples: \r\n      | FirstProduct      | SecondProduct      | ProductToRemove   | ExpectedCountAfterRemove | RemainingProduct   |\r\n      | Style Color Smart | Style Super Bright | Style Color Smart |                        1 | Style Super Bright |\r\n\r\n  #----------------------------------3---------------------------------------------------->\r\n  Scenario Outline: To verify Compare Page opens correctly\r\n    Given User is on first product url \"CompareFirstProductUrl\" and adds first product \"<FirstProduct>\" to the comparison list\r\n    And User is on second product url \"CompareSecondProductUrl\" and adds second product \"<SecondProduct>\" to the comparison list\r\n    And User can view the comparison page with the selected products\r\n    When User clicks on the Compare Now button\r\n    Then Compare Page should be displayed\r\n    And All selected products should be visible with their details\r\n\r\n    Examples: \r\n      | FirstProduct      | SecondProduct      |\r\n      | Style Color Smart | Style Super Bright |\r\n\r\n  #----------------------------------4---------------------------------------------------->\r\n  Scenario Outline: To verify product titles and count on the Compare page\r\n    Given User is on first product url \"CompareFirstProductUrl\" and adds first product \"<FirstProduct>\" to the comparison list\r\n    And User is on second product url \"CompareSecondProductUrl\" and adds second product \"<SecondProduct>\" to the comparison list\r\n    And User can view the comparison page with the selected products\r\n    When User clicks on the Compare Now button\r\n    Then User should see the correct product titles on the Compare page.\r\n    Then User should see and verify that the product count is \"<ExpectedCount>\"\r\n\r\n    Examples: \r\n      | FirstProduct      | SecondProduct      | ExpectedCount |\r\n      | Style Color Smart | Style Super Bright |             2 |\r\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/Compare_Product_Functionality.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@Scope1","id":"af61359c-7a54-46ec-ad00-cb67c2fab5c5"}],"language":"en","keyword":"Feature","name":"To Validate Compare Product Functionality(Two Product)","description":"","children":[{"scenario":{"location":{"line":5,"column":3},"tags":[],"keyword":"Scenario Outline","name":"To verify that user can add a product to the comparison list","description":"","steps":[{"location":{"line":6,"column":5},"keyword":"Given ","keywordType":"Context","text":"User is on first product url \"CompareFirstProductUrl\" and adds first product \"<FirstProduct>\" to the comparison list","id":"1642ea65-d656-4012-ac2a-6d038e4b35b1"},{"location":{"line":7,"column":5},"keyword":"And /Birlaopus/src/test/resources/features/Create_an_Account_Form.feature","name":"To verify Create an Account functionality with all mandatory fields empty","language":"en","steps":[{"astNodeIds":["cde4f158-3a98-469c-8a0b-fe1ceb10035d"],"id":"11b69781-3008-4300-a9bd-0323924eaef3","type":"Context","text":"User is on BirlaOpus HomePage \"birlaopusHomeUrl\""},{"astNodeIds":["6ffa29b9-12da-4eca-840f-b8422f6201e2"],"id":"efa00522-a221-4eba-8fa8-b26107fb1add","type":"Action","text":"User clicks on the profile icon"},{"astNodeIds":["296e10ba-4efb-4700-8450-a967e21cddc9"],"id":"276018d8-751e-4a7e-a37d-17c6fc93229b","type":"Outcome","text":"User clicks on the Create an Account option"},{"astNodeIds":["388bdab6-ac24-4b6f-a1c2-0321742cf7fe"],"id":"d2f9facc-1f5d-4071-a262-2bdf54023ee6","type":"Outcome","text":"User enters valid mobile number on the Create an Account"},{"astNodeIds":["f5573a3d-e62c-4e34-9dd4-f5cf54d7674c"],"id":"f068b9fd-c6d8-4cd4-b955-f7d6cbac7567","type":"Outcome","text":"User clicks on the Create an Account button"},{"astNodeIds":["90b52e7a-5324-4eb9-b3f4-b9ea350be60f"],"id":"cbe11a0d-0849-487e-bdca-f2c33f96376f","type":"Outcome","text":"User enters valid OTP and clicks on the Verify OTP button"},{"astNodeIds":["b3d17723-8f8c-4f98-b027-8c6159c9d81a"],"id":"3bfb763d-d03d-418e-972c-246b6ee46bae","type":"Outcome","text":"User clicks on the Save Details button"},{"astNodeIds":["b6651bc4-1446-42bd-89c5-3c8a3a751126"],"id":"acfb7c4a-e076-458f-80e3-5bf41710134b","type":"Outcome","text":"User should see \"This field is required\" error message for all mandatory fields"}],"tags":[{"name":"@module","astNodeId":"908edc59-63e8-4020-aabe-991fe4d048de"}],"astNodeIds":["377c5b5a-bd3a-46b9-941f-ce7bda9fce51"]}},{"source":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/End_to_End_%20Profuct_Journey.feature","data":"@module\nFeature: To Validate the Shop Happy End-to-End Product Journey Flow for an Existing User\n\n  Background: \n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n\n  #---------------------------------- Scenario 1 ----------------------------------#\n  Scenario Outline: To verify the end-to-end product journey through the checkout process with valid data for a logged-in user through navigation\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User click on Shop now button\n    Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    #And User click on whishlist icon\n    And User increase the product quantity \"<desiredQuantity>\"\n    Then User clicks on the Proceed to Enter Address button\n    And User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available\n    And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed\n    Then User clicks on the Edit button to update the shipping details.\n    And User enters a valid first name for the updated shipping address\n    And User enters a valid last name for the updated shipping address\n    And User enters a valid mobile number for the updated shipping address\n    And User enters a valid shipping address \"<address>\"\n    And User clicks on the Submit button to update the details.\n    And User clicks on the Proceed to Shipment button\n    Then User clicks on the Proceed to payment button\n\n    Examples: \n      | navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               5 | Mumbai  |                5 |\n\n  #---------------------------------- Scenario 2 ----------------------------------#\n  #Scenario Outline: To verify that the logged-in user continues shopping and completes checkout successfully via the Continue Shopping button\n  #And User clicks the cart icon on the header and removes the product from the cart if available\n  #Then User clicks on continue shopping button\n  #And User select product category \"<productcategory>\"\n  #Then User select product and click shop now button\n  #Then User selects Colour \"<Colour>\"\n  #Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n  #Then User enters a valid pincode \"<pincode>\" and check product availability\n  #And User click on add to cart button\n  #Then User click on View cart & Checkout button\n  #And User increase the product quantity \"<desiredQuantity>\"\n  #Then User clicks on the Proceed to Enter Address button\n  #And User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available\n  #And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n  #Then the total payable amount should be correctly calculated and displayed\n  #And User clicks on the Proceed to Shipment button\n  #Then User clicks on the Proceed to payment button\n  # Examples:\n  # | Colour    | quantity | pack | pincode | desiredQuantity | address | expectedQuantity | productcategory |\n  #| Rose dust |        1 |    1 |  400703 |               2 | Mumbai  |                2 | Interior Paints |\n  #---------------------------------- Scenario 3 ----------------------------------#\n  Scenario Outline: To verify the end-to-end product journey through the checkout process with valid data for a logged-in user using the search bar\n    And User clicks the cart icon on the header and removes the product from the cart if available\n    When User clicks on the search icon\n    Then User enters the product name \"<searchfor>\" in the search box\n    #And User select product category \"<category>\"\n    And User selects and clicks on the product\n    Then User click on Shop now button\n    Then User clcik on view all button\n    And User search Colour \"<search_colour>\"\n    #Then User selects Colour \"<Colour>\"\n    Then User selects quantity <quantity> of \"<pack>\" Ltr pack\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    And User increase the product quantity \"<desiredQuantity>\"\n    Then User clicks on the Proceed to Enter Address button\n    And User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available\n    And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed\n    And User clicks on the Proceed to Shipment button\n    Then User clicks on the Proceed to payment button\n\n    Examples: \n      | searchfor          | Colour    | quantity | pack | pincode | desiredQuantity | expectedQuantity | search_colour |\n      | Calista Ever Clear | Rose dust |        1 |    1 |  411033 |               2 |                2 | Rose dust     |\n  #---------------------------------- Scenario 4 ----------------------------------#\r\n  #Scenario Outline: To verify the validation message when the cart value is less than INR 999 for a logged-in user\r\n    #Then User clicks the cart icon on the header and removes the product from the cart if available\r\n    #When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\r\n    #Then User click on Shop now button\r\n    #Then User selects Colour \"<Colour>\"\r\n    #Then User selects quantity <quantity> of \"<pack>\" Ltr pack\r\n    #Then User enters a valid pincode \"<pincode>\" and check product availability\r\n    #And User click on add to cart button\r\n    #Then User click on View cart & Checkout button\r\n    #And User click on whishlist icon\r\n    #And User increase the product quantity \"<desiredQuantity>\"\r\n    #Then User clicks on the Proceed to Enter Address button\r\n    #And the validation message should be displayed as \"To proceed to checkout, we request a minimum cart value of INR 999.\"\r\n    #Then User clicks on the popup Close button\r\n    #And User clicks the cart icon on the header and removes the product from the cart if available\r\n#\r\n    #Examples: \r\n      #| navmenu  | navtab          | productname      | Colour     | quantity | pack | pincode | desiredQuantity |\r\n      #| Products | Exterior paints | Calista Neo Star | Jaipur red |        1 |    1 |  400703 |               2 |\r\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/End_to_End_%20Profuct_Journey.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@module","id":"c6d45147-4f18-4d0b-97fc-0f870b0c4fee"}],"language":"en","keyword":"Feature","name":"To Validate the Shop Happy End-to-End Product Journey Flow for an Existing User","description":"","children":[{"background":{"location":{"line":4,"column":3},"keyword":"Background","name":"","description":"","steps":[{"location":{"line":5,"column":5},"keyword":"Given ","keywordTy 51e0656-dd96-40f7-a000-1913d3138cf8","e916e61e-a165-4e90-aca8-e989aa33f93c"],"id":"d7697d95-0ba4-4d4e-83b1-693e4a4872db","type":"Outcome","text":"User clicks on the Proceed to Enter Address button"},{"astNodeIds":["35e1f16f-c51c-445f-b2da-e29a1a5e6114","e916e61e-a165-4e90-aca8-e989aa33f93c"],"id":"e661f1f8-4363-4155-844c-7bfbb03daf39","type":"Outcome","text":"User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available"},{"astNodeIds":["7d6208b9-7f9c-4217-9df8-aeaebcab261e","e916e61e-a165-4e90-aca8-e989aa33f93c"],"id":"3e1773df-f7d2-4c5b-aa4d-dc27932dad68","type":"Outcome","text":"User verifies the product quantity in the final order summary \"2\""},{"astNodeIds":["461d2e61-2256-4e66-9155-4abf4af8e3a5","e916e61e-a165-4e90-aca8-e989aa33f93c"],"id":"8cb1fcb3-4524-47ee-be50-d12ffc36d08a","type":"Outcome","text":"the total payable amount should be correctly calculated and displayed"},{"astNodeIds":["8c7840ae-8660-43bb-b360-4638a8df3c8a","e916e61e-a165-4e90-aca8-e989aa33f93c"],"id":"989ecc92-3426-48a0-91d7-1a125b532aa7","type":"Outcome","text":"User clicks on the Proceed to Shipment button"},{"astNodeIds":["5e548cf9-8913-42f8-85d8-f0df49e7708c","e916e61e-a165-4e90-aca8-e989aa33f93c"],"id":"60049e94-d1d4-4635-a19b-346606440eb8","type":"Outcome","text":"User clicks on the Proceed to payment button"}],"tags":[{"name":"@module","astNodeId":"c6d45147-4f18-4d0b-97fc-0f870b0c4fee"}],"astNodeIds":["b535a289-e9e9-4b88-b6b3-8acff1522df8","e916e61e-a165-4e90-aca8-e989aa33f93c"]}},{"source":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/End_to_End_Colour_Swatch_Journey.feature","data":"@module\nFeature: To Validate the End-to-End colour swatch journey flow for a logged-in user, including adding and removing colour swatches and managing the wishlist.\n\n  Background: \n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n@test\n  #---------------------------------- Scenario 1 ----------------------------------#\n  Scenario Outline: To verify the end-to-end  colour swatch journey through the checkout process with valid data for a logged-in user through navigation\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    #When User clicks on the \"<Shop_Product>\" product in the Shop section\n    Then User selects Colour for colour swatch \"<Colour>\"\n    Then User selects colour swatch quantity <quantity>\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    #And User click on whishlist icon\n    And User increase the product quantity \"<desiredQuantity>\"\n    Then User clicks on the Proceed to Enter Address button\n    And User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available\n    And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed\n    And User clicks on the Proceed to Shipment button\n    Then User clicks on the Proceed to payment button\n\n    Examples: \n      | navmenu | navtab       | productname   | Colour    | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Shop    | Colour Tools | Colour Swatch | Rose dust |        1 |    1 |  400703 |               2 | Mumbai  |                2 |\n\n  #---------------------------------- Scenario 2 ----------------------------------#\n  Scenario Outline: To verify that a logged-in user can successfully add a Colour Swatch to the cart through navigation(cart page)\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User selects Colour for colour swatch \"<Colour>\"\n    Then User selects colour swatch quantity <quantity>\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    Then Product should be added to the cart successfully\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n\n    Examples: \n      | navmenu | navtab       | productname   | Colour    | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Shop    | Colour Tools | Colour Swatch | Rose dust |        1 |    1 |  400703 |               2 | Mumbai  |                2 |\n\n  #---------------------------------- Scenario 3 ----------------------------------#\n  Scenario Outline: To verify that a logged-in user can remove a Colour Swatch product from the header cart(cart page)\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User selects Colour for colour swatch \"<Colour>\"\n    Then User selects colour swatch quantity <quantity>\n    Then User enters a valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button\n    Then User click on View cart & Checkout button\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    And Cart count should be updated to \"<expectedCount>\"\n\n    Examples: \n      | navmenu | navtab       | productname   | Colour    | quantity | pack | pincode | expectedCount |\n      | Shop    | Colour Tools | Colour Swatch | Rose dust |        1 |    1 |  400703 |             0 |\n\n  #---------------------------------- Scenario 4 ----------------------------------#\n  Scenario Outline: To verify successful colour swatch add-to-wishlist functionality through navigation for a logged-in user(product details page)\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User selects Colour for colour swatch \"<Colour>\"\n    And User clicks the Wishlist icon of the selected colour swatch on the Product Details page\n    Then Product should be added to the wishlist successfully\n\n    Examples: \n      | navmenu | navtab       | productname   | optionText       | Colour    |\n      | Shop    | Colour Tools | Colour Swatch | Delete a Product | Rose dust |\n\n  #---------------------------------- Scenario 5 ----------------------------------#\n  Scenario Outline: To verify successful colour swatch remove-to-wishlist functionality through navigation for a logged-in user.(profile page)\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User selects Colour for colour swatch \"<Colour>\"\n    And User clicks the Wishlist icon of the selected colour swatch on the Product Details page\n    Then User click whishlist icon on top page\n    And User clicks on \"<tabName>\" tab\n    Then the User clicks the product option button in favourites\n    And the User selects \"<optionText>\" from the product options in the wishlist\n    Then colour swatch should be removed from the wishlist successfully\n\n    Examples: \n      | navmenu | navtab       | productname   | tabName    | optionText          | Colour    |\n      | Shop    | Colour Tools | Colour Swatch | Favourites | Delete colour story | Rose dust |\n\n  #---------------------------------- Scenario 6 ----------------------------------#\n  Scenario Outline: To verify error message when user enters invalid pincode for colour swatch\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User selects Colour for colour swatch \"<Colour>\"\n    Then User selects colour swatch quantity <quantity>\n    Then User enters an invalid pincode \"<pincode>\" and check product availability\n    Then User should see an error message for invalid pincode for colour swatch \"<errorMessage>\"\n\n    Examples: \n      | navmenu | navtab       | productname   | Colour    | quantity | pincode | errorMessage                 |\n      | Shop    | Colour Tools | Colour Swatch | Rose dust |        1 |     123 | Please enter a valid pincode |\n\n  #---------------------------------- Scenario 7 ----------------------------------#\n  Scenario Outline: To verify error message when pincode field is empty\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User selects Colour for colour swatch \"<Colour>\"\n    Then User selects colour swatch quantity <quantity>\n    And User click on pincode serviceability check button\n    Then User should see the error message when pincode field is empty \"This field is required\"\n\n    Examples: \n      | navmenu | navtab       | productname   | Colour    | quantity |\n      | Shop    | Colour Tools | Colour Swatch | Rose dust |        1 |\n\n  #---------------------------------- Scenario 8 ----------------------------------#\n  Scenario Outline: To verify user cannot proceed when invalid quantity is selected\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 product name \"<productname>\" through navigation bar\n    Then User selects Colour for colour swatch \"<Colour>\"\n    Then User selects colour swatch quantity <quantity>\n    Then Add to cart button should be disabled\n\n    Examples: \n      | navmenu | navtab       | productname   | Colour    | quantity |\n      | Shop    | Colour Tools | Colour Swatch | Rose dust |        0 |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/End_to_End_Colour_Swatch_Journey.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@module","id":"aa0de0c6-98c4-42c0-916c-bff948c237a5"}],"language":"en","keyword":"Feature","name":"To Validate the End-to-End colour swatch journey flow for a logged-in user, including adding and removing colour swatches and managing the wishlist.","description":"","children":[{"background":{"location":{"line":4,"column":3},"keyword":"Background","name":"","description":"","steps":[{"location":{"line":5,"column":5},"keyword":"Given ","keywordType":"Context","text":"User is on BirlaOpus HomePage \"birlaopusHomeUrl\"","id":"b0e7af4d-3f39-4182-9f48-92eddc2a77cd"},{"location":{"line":6,"column":5},"keyword":"When ","keywordType":"Action","text":"User clicks on the profile icon","id":"fb23d430-e08f-4e5f-bcb8-e06d1de3215e"},{"location":{"line":7,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"User clicks on the Sign In button","id":"371dcefc-7f6d-479d-8937-074b8f7fc067"},{"location":{"line":8,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"User enters valid mobile number on the Sign In page","id":"84fdc580-8914-47ce-9c71-fd3a820d44c1"},{"location":{"line":9,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"the User clicks on the Sign In button after entering the mobile number","id":"963a4208-0a99-4 ----------------------------------#\n  Scenario Outline: To verify the end-to-end Wallpapers journey through the checkout process with valid data for a logged-in user through navigation\n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 wallpaper name \"<productname>\" through navigation bar\n    Then the User selects a wallpaper shade \"<shades_code>\"\n    Then User enters valid pincode \"<pincode>\" and check product availability\n    And User click on add to cart button on wallpaper section\n    Then User click on View cart & Checkout button on wallpaper section\n    And User increase the product quantity \"<desiredQuantity>\"\n    Then User clicks on the Proceed to Enter Address button\n    And User clicks on the Apply button, verifies the availability of coupon vouchers, and applies a coupon if available\n    And User verifies the product quantity in the final order summary \"<expectedQuantity>\"\n    Then the total payable amount should be correctly calculated and displayed on wallpaper\n    And User clicks on the Proceed to Shipment button\n    Then User clicks on the Proceed to payment button\n\n    Examples: \n      | navmenu | navtab     | productname          | shades_code | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Shop    | Wallpapers | Textilia Tabit 32001 |       32102 |        1 |    1 |  400703 |               2 | Mumbai  |                2 |\n\n  #---------------------------------- Scenario 2 ----------------------------------#\n  Scenario Outline: To verify that a logged-in user can successfully add a Wallpapers to the cart through navigation\n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 wallpaper name \"<productname>\" through navigation bar\n    Then the User selects a wallpaper shade \"<shades_code>\"\n    Then User enters a valid pincode \"<pincode>\" on wallpaper\n    And User click on pincode serviceability check button on wallpaper\n    And User click on add to cart button on wallpaper section\n    Then User click on View cart & Checkout button on wallpaper section\n    Then Product should be added to the cart successfully\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n\n    Examples: \n      | navmenu | navtab     | productname          | shades_code | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Shop    | Wallpapers | Textilia Tabit 32001 |       32102 |        1 |    1 |  500001 |               2 | Mumbai  |                2 |\n\n  #---------------------------------- Scenario 3 ----------------------------------#\n  Scenario Outline: To verify that a logged-in user can remove a Wallpapers product from the header cart(cart page)\n    Given User is on wallpaper Product page \"WallpaperProductUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    #Then the User selects a wallpaper shade \"<shades_code>\"\n    Then User enters a valid pincode \"<pincode>\" on wallpaper\n    And User click on pincode serviceability check button on wallpaper\n    And User click on add to cart button on wallpaper section\n    Then User clicks the cart icon on the header and removes the product from the cart if available\n    And Cart count should be updated to \"<expectedCount>\"\n\n    Examples: \n      | navmenu | navtab     | productname               | shades_code | quantity | pack | pincode | desiredQuantity | address | expectedCount |\n      | Shop    | Wallpapers | Chromatic Geometric 45124 |       45126 |        1 |    1 |  500001 |               2 | Mumbai  |             0 |\n\n  #---------------------------------- Scenario 4 ----------------------------------#\n  Scenario Outline: To verify successful Wallpapers add-to-wishlist functionality through navigation for a logged-in user\n    Given User is on wallpaper Product page \"WallpaperProductUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    #Then the User selects a wallpaper shade \"<shades_code>\"\n    And User clicks the Wishlist icon for Wallpapers on the Product Details page\n    Then Product should be added to the wishlist successfully\n\n    Examples: \n      | navmenu | navtab     | productname               | optionText          | shades_code |\n      | Shop    | Wallpapers | Chromatic Geometric 45124 | Delete colour story |       45128 |\n\n  #---------------------------------- Scenario 5 ----------------------------------#\n  Scenario Outline: To verify successful Wallpapers remove-to-wishlist functionality through navigation for a logged-in user.(profile page)\n    Given User is on wallpaper Product page \"WallpaperProductUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    Then the User selects a wallpaper shade \"<shades_code>\"\n    And User clicks the Wishlist icon for Wallpapers on the Product Details page\n    Then Product should be added to the wishlist successfully\n    Then User click whishlist icon on top page\n    And User clicks on \"<tabName>\" tab\n    Then the User clicks the product option button in favourites\n    And the User selects \"<optionText>\" from the product options in the wishlist\n    Then Product should be removed from the wishlist successfully\n\n    Examples: \n      | navmenu | navtab     | productname               | tabName    | optionText       | shades_code |\n      | Shop    | Wallpapers | Chromatic Geometric 45124 | Favourites | Delete Wallpaper |       45128 |\n\n  #---------------------------------- Scenario 6 ----------------------------------#\n  Scenario Outline: To verify error message when user enters invalid pincode for wallpaper\n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 wallpaper name \"<productname>\" through navigation bar\n    Then the User selects a wallpaper shade \"<shades_code>\"\n    Then User enters a valid pincode \"<pincode>\" on wallpaper\n    And User click on pincode serviceability check button on wallpaper\n    Then User should see an error message for invalid pincode for Wallpapers \"<errorMessage>\"\n\n    Examples: \n      | navmenu | navtab     | productname          | shades_code | quantity | pack | pincode | desiredQuantity | address | expectedQuantity | errorMessage                 |\n      | Shop    | Wallpapers | Textilia Tabit 32001 |       32102 |        1 |    1 |     400 |               2 | Mumbai  |                2 | Please enter a valid pincode |\n\n  #---------------------------------- Scenario 7 ----------------------------------#\n  Scenario Outline: To verify error message when pincode field is empty for wallpaper\n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\n    When User clicks on the profile icon\n    And User clicks on the Sign In button\n    And User enters valid mobile number on the Sign In page\n    And the User clicks on the Sign In button after entering the mobile number\n    And User enters valid OTP and clicks on the Verify OTP button\n    Then User clicks on the close icon\n    When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 wallpaper name \"<productname>\" through navigation bar\n    Then the User selects a wallpaper shade \"<shades_code>\"\n    And User click on pincode serviceability check button on wallpaper\n    Then User should see the error message when pincode field is empty \"This field is required\"\n\n    Examples: \n      | navmenu | navtab     | productname          | shades_code | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\n      | Shop    | Wallpapers | Textilia Tabit 32001 |       32102 |        1 |    1 |  400703 |               2 | Mumbai  |                2 |\n  #---------------------------------- Scenario 8 ----------------------------------#\r\n  #Scenario Outline: To verify user cannot proceed when invalid quantity is selected\r\n    #When User select product main navigation L1 \"<navmenu>\", sub navigation L2 \"<navtab>\" and L3 wallpaper name \"<productname>\" through navigation bar\r\n    #Then the User selects a wallpaper shade \"<shades_code>\"\r\n    #Then Add to cart button should be disabled\r\n#\r\n    #Examples: \r\n      #| navmenu | navtab     | productname          | shades_code | quantity | pack | pincode | desiredQuantity | address | expectedQuantity |\r\n      #| Shop    | Wallpapers | Textilia Tabit 32001 |           32102 |        1 |    1 |  400703 |               2 | Mumbai  |                2 |\r\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Backup/Birla_Prod/Birlaopus/Birlaopus/src/test/resources/features/End_to_End_Wallpapers_Journey.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@module","id":"7d418002-a3f2-491d-802d-958cec0fdef2"}],"language":"en","keyword":"Feature","name":"To Validate the happy end-to-end Wallpapers journey flow for a logged-in user, including adding and removing Wallpapers and managing the wishlist.","description":"","children":[{"scenario":{"location":{"line":5,"column":3},"tags":[],"keyword":"Scenario Outline","name":"To verify the end-to-end Wallpapers journey through the checkout process with valid data for a logged-in user through navigation","description":"","steps":[{"location":{"line":6,"column":5},"keyword":"Given ","keywordType":"Context","text":"User is on BirlaOpus HomePage \"birlaopusHomeUrl\"","id":"9f229459-aec4-4a76-8d09-86d41cf7a298"},{"location":{"line":7,"column":5},"keyword":"When ","keywordType":"Action","text":"User clicks on the profile icon","id":"4088ba83-437e-4ea3-be2e-2cad382dd21a"},{"location":{"line" ch Contact Form Subscription\r\n\r\n  Background: \r\n    Given User is on BirlaOpus HomePage \"birlaopusHomeUrl\"\r\n@test\r\n  #----------------------------------1---------------------------------------------------->\r\n  Scenario Outline: To verify successful submission of the Get in Touch form with updated mandatory data for a logged-in user\r\n    When User clicks on the profile icon\r\n    And User clicks on the Sign In button\r\n    And User enters valid mobile number on the Sign In page\r\n    And the User clicks on the Sign In button after entering the mobile number\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User clicks on the close icon\r\n    When User hovers over the Get in Touch popup\r\n    And User clicks on the Get in Touch option\r\n    #And User updates the mandatory field Name\r\n    And User updates the mandatory field Email\r\n    #And User updates the mandatory field Phone Number\r\n    And User updates the mandatory field Pincode \"<Pincode>\"\r\n    And User clicks submits the Get in Touch form\r\n    And User captures and validates API request and response for \"lead/shortForm\"\r\n\r\n    #And User should see the acknowledgment message after successful submission \"Thank You For Reaching out to us !\"\r\n    Examples: \r\n      | Pincode |\r\n      |  400001 |\r\n\r\n  #----------------------------------2---------------------------------------------------->\r\n  Scenario Outline: To verify that a validation message is displayed when the user enters an invalid pincode on the Get in Touch form\r\n    When User clicks on the profile icon\r\n    And User clicks on the Sign In button\r\n    And User enters valid mobile number on the Sign In page\r\n    And the User clicks on the Sign In button after entering the mobile number\r\n    And User enters valid OTP and clicks on the Verify OTP button\r\n    Then User clicks on the close icon\r\n    When User hovers over the Get in Touch popup\r\n    And User clicks
